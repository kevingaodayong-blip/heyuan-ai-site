<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>5100智能报价单 - 一级代理商 - 手机单文件版</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14242d;
        --muted: #5f717b;
        --line: #d8e5ea;
        --paper: #fbfdfc;
        --ice: #eef8fb;
        --blue: #0f6b8f;
        --green: #397b63;
        --gold: #b8872c;
        --peach: #e9a47f;
        --accent: #0f6b8f;
        --shadow: 0 18px 44px rgba(21, 55, 75, 0.12);
      }

      * { box-sizing: border-box; }

      html {
        min-width: 320px;
        background: #e9f2f5;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #f8fbfc 0%, #e7f2f5 36%, #f7faf9 100%);
        letter-spacing: 0;
      }

      button { font: inherit; cursor: pointer; }

      .page {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      .hero,
      .selector,
      .detail,
      .summary-tile {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        padding: 24px;
      }

      .brand,
      .eyebrow {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 13px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        color: #071e33;
        font-size: clamp(26px, 4vw, 42px);
        line-height: 1.12;
      }

      .hero-copy {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .role-box {
        min-width: 238px;
        padding: 16px;
        border: 1px solid rgba(184, 135, 44, 0.28);
        border-radius: 8px;
        background: #fffaf0;
      }

      .role-box span,
      .summary-tile span,
      .metric small,
      .spread-card span,
      .vip-card span,
      .detail-title small,
      .product-card small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .role-box strong {
        display: block;
        margin-top: 6px;
        color: var(--accent);
        font-size: 24px;
      }

      .overview {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }

      .summary-tile {
        padding: 14px;
        box-shadow: 0 12px 28px rgba(21, 55, 75, 0.08);
      }

      .summary-tile strong {
        display: block;
        margin-top: 6px;
        color: #071e33;
        font-size: 20px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .selector {
        padding: 14px;
        box-shadow: 0 12px 32px rgba(21, 55, 75, 0.08);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .section-head h2 {
        margin: 0;
        color: #071e33;
        font-size: 18px;
      }

      .section-head span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .product-list {
        display: grid;
        gap: 10px;
      }

      .product-card {
        width: 100%;
        min-height: 142px;
        border: 1px solid var(--line);
        border-left: 5px solid var(--blue);
        border-radius: 8px;
        padding: 12px;
        text-align: left;
        background: #fff;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      .product-card[data-tone="peach"] { border-left-color: var(--peach); }
      .product-card[data-tone="green"] { border-left-color: var(--green); }
      .product-card[data-tone="gold"] { border-left-color: var(--gold); }

      .product-card.is-active {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 107, 143, 0.12);
        transform: translateY(-1px);
      }

      .product-main {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .product-thumb {
        display: block;
        width: 92px;
        aspect-ratio: 1;
        border: 1px solid #e5eef2;
        border-radius: 8px;
        object-fit: contain;
        padding: 5px;
        background: #fff;
      }

      .product-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .product-line strong {
        color: #071e33;
        font-size: 18px;
      }

      .badge {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 5px 9px;
        color: var(--accent);
        background: rgba(15, 107, 143, 0.08);
        font-size: 12px;
        font-weight: 900;
      }

      .product-card p {
        margin: 7px 0 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .mini-price {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .mini-price span {
        padding: 8px;
        border-radius: 8px;
        background: #f5fafb;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .mini-price b {
        display: block;
        margin-top: 2px;
        color: #071e33;
        font-size: 15px;
      }

      .detail {
        overflow: hidden;
        box-shadow: 0 12px 32px rgba(21, 55, 75, 0.08);
      }

      .detail-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(170px, 230px) auto;
        gap: 16px;
        align-items: start;
        padding: 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(236, 248, 251, 0.96), rgba(255, 250, 240, 0.68));
      }

      .detail-title h2 {
        margin: 4px 0 8px;
        color: #071e33;
        font-size: 26px;
        line-height: 1.15;
      }

      .detail-title p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .detail-visual {
        margin: 0;
        border: 1px solid rgba(15, 107, 143, 0.14);
        border-radius: 8px;
        background: #fff;
      }

      .detail-visual img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        padding: 10px;
      }

      .amount {
        min-width: 210px;
        padding: 14px;
        border: 1px solid rgba(15, 107, 143, 0.16);
        border-radius: 8px;
        background: #fff;
        text-align: right;
      }

      .amount span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }

      .amount strong {
        display: block;
        margin-top: 4px;
        color: var(--accent);
        font-size: 34px;
        line-height: 1.1;
      }

      .qty-tabs,
      .tier-tabs,
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tools {
        margin-top: 14px;
      }

      .qty-tabs {
        padding: 14px 18px 0;
      }

      .tier-tabs {
        padding: 14px 18px 0;
      }

      .action,
      .qty-tab,
      .tier-tab {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 14px;
        color: var(--ink);
        background: #fff;
        font-weight: 900;
      }

      .action.primary,
      .qty-tab.is-active,
      .tier-tab.is-active {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }

      .tier-tab {
        flex: 1 1 118px;
        min-height: 54px;
        text-align: left;
      }

      .tier-tab span {
        display: block;
        font-size: 11px;
        opacity: 0.76;
      }

      .tier-tab b {
        display: block;
        margin-top: 2px;
        font-size: 15px;
      }

      .spread,
      .metrics,
      .vip-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 14px 18px 0;
      }

      .spread-card,
      .metric,
      .vip-card {
        min-height: 86px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .spread-card {
        border-color: rgba(184, 135, 44, 0.25);
        background: #fffaf0;
      }

      .spread-card strong,
      .metric strong,
      .vip-card strong {
        display: block;
        margin-top: 7px;
        color: #071e33;
        font-size: 22px;
        line-height: 1.12;
      }

      .spread-card.is-diff strong,
      .vip-card strong em,
      .diff-cell {
        color: #b05c21;
        font-style: normal;
        font-weight: 900;
      }

      .vip-card small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-weight: 800;
      }

      .panel-title {
        margin: 18px 18px 0;
        color: #071e33;
        font-size: 17px;
        font-weight: 900;
      }

      .table-wrap {
        padding: 12px 18px 18px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 840px;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
        white-space: nowrap;
      }

      th {
        color: #071e33;
        background: #f3f8fa;
        font-weight: 900;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      tr.is-current td {
        background: rgba(15, 107, 143, 0.06);
        font-weight: 900;
      }

      .note {
        margin: 0 18px 18px;
        padding: 12px 14px;
        border: 1px solid rgba(184, 135, 44, 0.2);
        border-radius: 8px;
        color: #6d5731;
        background: #fffaf0;
        font-size: 13px;
        line-height: 1.55;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 20;
        max-width: min(320px, calc(100vw - 36px));
        padding: 12px 14px;
        border-radius: 8px;
        color: #fff;
        background: #071e33;
        box-shadow: var(--shadow);
        font-size: 14px;
        font-weight: 800;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .hero,
        .workspace,
        .detail-top {
          grid-template-columns: 1fr;
        }

        .amount {
          text-align: left;
        }
      }

      @media (max-width: 760px) {
        .overview,
        .spread,
        .metrics,
        .vip-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .page {
          width: min(100% - 20px, 520px);
          padding-top: 12px;
        }

        .hero,
        .detail-top {
          padding: 16px;
        }

        .overview,
        .spread,
        .metrics,
        .vip-grid {
          grid-template-columns: 1fr 1fr;
        }

        .product-main {
          grid-template-columns: 84px minmax(0, 1fr);
        }

        .product-thumb {
          width: 84px;
        }

        .qty-tabs,
        .tier-tabs,
        .spread,
        .metrics,
        .vip-grid,
        .table-wrap {
          padding-left: 14px;
          padding-right: 14px;
        }

        .role-box,
        .amount {
          min-width: 0;
        }

        .amount strong {
          font-size: 30px;
        }
      }

      @media print {
        body {
          background: #fff;
        }

        .page {
          width: 100%;
          padding: 0;
        }

        .hero,
        .selector,
        .detail,
        .summary-tile {
          box-shadow: none;
        }

        .tools,
        .toast {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="brand">5100 藏冰川矿泉水 · 大陆版价目表</p>

          <p class="hero-copy">四个型号 · 半吨/一吨 · 价格层级报价 · VIP A/B/C/D 差价总览</p>

      function money(value, digits) {
        const fixed = Number(value).toLocaleString("zh-CN", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits,
        });
        return "¥" + fixed;
      }

      function signedMoney(value, digits) {
        if (Math.abs(value) < 0.005) return "¥0";
        return (value > 0 ? "+" : "-") + money(Math.abs(value), digits);
      }

      function number(value, digits = 0) {
        return Number(value).toLocaleString("zh-CN", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits,
        });
      }

      function tierLabel(key) {
        return DATA.tiers[key].label;
      }

      function getProduct() {
        return DATA.products.find((product) => product.id === currentProductId);
      }

      function quote(product, tierKey) {
        return product.quotes[tierKey];
      }

      function makePlan(product, tierKey = currentTierKey, planName = currentPlan) {
        const ratio = planName === "ton" ? 1 : 0.5;
        const tierQuote = quote(product, tierKey);
        const price = tierQuote[planName];
        const cards = product.cardsPerTon * ratio;
        const specRows = product.specs.map((spec, index) => {
          const boxes = cards * spec.boxesPerCard;
          const bottles = boxes * spec.bottlesPerBox;
          return { ...spec, quotedUnit: tierQuote.units[index], cards, boxes, bottles };
        });
        const totalBoxes = specRows.reduce((sum, row) => sum + row.boxes, 0);
        const totalBottles = specRows.reduce((sum, row) => sum + row.bottles, 0);
        return {
          price,
          cards,
          specRows,
          totalBoxes,
          totalBottles,
          cardPrice: price / cards,
          avgCasePrice: price / totalBoxes,
          avgBottlePrice: price / totalBottles,
        };
      }

      function unitRows(product, plan) {
        const singleSpec = product.specs.length === 1;
        const quotedAmount = singleSpec
          ? 0
          : plan.specRows.reduce((sum, row) => sum + row.quotedUnit * row.bottles, 0);
        const allocationScale = singleSpec ? 1 : plan.price / quotedAmount;
        return plan.specRows.map((row) => {
          const bottlePrice = singleSpec ? plan.price / row.bottles : row.quotedUnit * allocationScale;
          return { ...row, bottlePrice, casePrice: bottlePrice * row.bottlesPerBox };
        });
      }

      function previousTierKey(tierKey) {
        const index = DATA.visibleKeys.indexOf(tierKey);
        return index > 0 ? DATA.visibleKeys[index - 1] : null;
      }

      function diffToOwner(product, tierKey) {
        return makePlan(product, tierKey).price - makePlan(product, DATA.ownerKey).price;
      }

      function diffToPrevious(product, tierKey) {
        const prevKey = previousTierKey(tierKey);
        if (!prevKey) return 0;
        return makePlan(product, tierKey).price - makePlan(product, prevKey).price;
      }

      function renderProductCards() {
        productList.innerHTML = DATA.products.map((product) => {
          const active = product.id === currentProductId ? " is-active" : "";
          const tierQuote = quote(product, currentTierKey);
          const current = makePlan(product, currentTierKey, "ton");
          const vipDKey = DATA.visibleKeys.includes("vipD") ? "vipD" : DATA.visibleKeys[DATA.visibleKeys.length - 1];
          const vipDiff = quote(product, vipDKey).ton - quote(product, DATA.ownerKey).ton;
          return '<button class="product-card' + active + '" data-id="' + product.id + '" data-tone="' + product.tone + '" type="button">' +
            '<div class="product-main">' +
              '<img class="product-thumb" src="' + product.image + '" alt="' + product.name + '" />' +
              '<div>' +
                '<span class="product-line"><strong>' + product.name + '</strong><span class="badge">' + product.badge + '</span></span>' +
                '<p>' + product.subtitle + '</p>' +
                '<div class="mini-price">' +
                  '<span>' + tierLabel(currentTierKey) + '一吨<b>' + money(tierQuote.ton, 0) + '</b></span>' +
                  '<span>' + tierLabel(currentTierKey) + '半吨<b>' + money(tierQuote.half, 0) + '</b></span>' +
                '</div>' +
                '<small>VIP D 较本级一吨差价：' + signedMoney(vipDiff, 0) + '</small>' +
                '<small>一吨 ' + number(current.cards) + ' 卡 / ' + number(current.totalBoxes) + ' 箱 / ' + number(current.totalBottles) + ' 瓶</small>' +
              '</div>' +
            '</div>' +
          '</button>';
        }).join("");

        [...productList.querySelectorAll(".product-card")].forEach((button) => {
          button.addEventListener("click", () => {
            currentProductId = button.dataset.id;
            render();
          });
        });
      }

      function renderTierTabs(product) {
        tierTabs.innerHTML = DATA.visibleKeys.map((key) => {
          const active = key === currentTierKey ? " is-active" : "";
          const price = makePlan(product, key).price;
          const prevDiff = diffToPrevious(product, key);
          const diffText = key === DATA.ownerKey ? "本级" : "较上层 " + signedMoney(prevDiff, 0);
          return '<button class="tier-tab' + active + '" type="button" data-tier="' + key + '">' +
            '<span>' + diffText + '</span><b>' + tierLabel(key) + " " + money(price, 0) + '</b>' +
          '</button>';
        }).join("");

        [...tierTabs.querySelectorAll(".tier-tab")].forEach((button) => {
          button.addEventListener("click", () => {
            currentTierKey = button.dataset.tier;
            render();
          });
        });
      }

      function renderSpread(product, plan) {
        const ownerPlan = makePlan(product, DATA.ownerKey);
        const prevKey = previousTierKey(currentTierKey);
        const prevPlan = prevKey ? makePlan(product, prevKey) : ownerPlan;
        const items = [
          ["当前价格层级", tierLabel(currentTierKey)],
          ["当前价格", money(plan.price, 0)],
          ["较上一价位", currentTierKey === DATA.ownerKey ? "本级" : signedMoney(plan.price - prevPlan.price, 0), true],
          ["较本级", signedMoney(plan.price - ownerPlan.price, 0), true],
        ];
        spread.innerHTML = items.map((item) =>
          '<div class="spread-card' + (item[2] ? " is-diff" : "") + '"><span>' + item[0] + '</span><strong>' + item[1] + '</strong></div>'
        ).join("");
      }

      function renderMetrics(product, plan) {
        const singleSpec = product.specs.length === 1;
        const caseLabel = singleSpec ? "单箱折算" : "组合均价/箱";
        const bottleLabel = singleSpec ? "单瓶折算" : "组合均价/瓶";
        const items = [
          ["提货卡数", number(plan.cards) + " 卡"],
          ["总箱数", number(plan.totalBoxes) + " 箱"],
          ["总瓶数", number(plan.totalBottles) + " 瓶"],
          ["每卡折算", money(plan.cardPrice, 2)],
          [caseLabel, money(plan.avgCasePrice, 2)],
          [bottleLabel, money(plan.avgBottlePrice, 2)],

          ["本级档位", tierLabel(DATA.ownerKey)],

        metrics.innerHTML = items.map((item) =>

          "提货卡：" + number(plan.cards) + " 卡",
          "箱数：" + number(plan.totalBoxes) + " 箱",
          "瓶数：" + number(plan.totalBottles) + " 瓶",
        ];
        return lines.join("\n");
      }

      [...document.querySelectorAll(".qty-tab")].forEach((button) => {
        button.addEventListener("click", () => {
          currentPlan = button.dataset.plan;
          render();
        });
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
      }

      render();
    </script>
  </body>
</html>
